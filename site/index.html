    #loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); text-align: center;

    @keyframes bob { 50% { transform: translateY(-8px) rotate(2deg); } }
